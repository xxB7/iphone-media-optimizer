# ==============================================================================
# إعدادات أداة تخفيف وضغط استديو الآيفون (iPhone DCIM Optimizer Configuration)
# ==============================================================================

# إعدادات معالجة الفيديو عبر كرت الشاشة (Video NVENC Settings)
video:
  # معامل الجودة الثابتة (Constant Quality - CQ).
  # النطاق الموصى به: 26 - 32 (كلما زاد الرقم، زاد الضغط وصغر الحجم، 28 متوازن وممتاز لشاشات الجوال)
  cq: 28

  # إعداد التشفير المسبق (Preset). الخيارات: p1 (أسرع) إلى p7 (أعلى دقة).
  # p5 يوفر توازناً استثنائياً بين سرعة الضغط وجودة الصورة لبطاقة RTX 3060 Ti
  preset: "p5"

  # نغمة التشفير (Tuning). الخيار الموصى به: hq (جودة عالية)
  tune: "hq"

  # التحكم في معدل البت: vbr (Variable Bitrate)
  rate_control: "vbr"

  # تمرير الصوت الأصلي دون إعادة تشفير (Passthrough) للحفاظ على جودة 100% والصوت المكاني
  copy_audio: true

  # الحفاظ على إطارات مقاطع الحركة البطيئة (Slo-Mo 120/240 fps)
  keep_framerate: true

  # دعم ألوان HDR و 10-bit التلقائي (Dolby Vision / HLG)
  enable_hdr_10bit: true

  # وسم التوافق الإلزامي لأجهزة آبل في حاوية MP4/MOV
  apple_compatibility_tag: "hvc1"


# إعدادات ضغط الصور (Photo Compression Settings)
photo:
  # جودة ضغط صور HEIC (بين 60 إلى 85، 72 يعطي تقليلاً بحجم 60-75% دون فرق بالعين المجردة)
  heic_quality: 72

  # جودة ضغط صور JPEG (بين 70 إلى 85)
  jpeg_quality: 78

  # أقصى أبعاد مسموحة للصور العريضة جداً (مثلاً صور الـ 48MP للآيفون برو).
  # إذا كانت 0 أو false، يتم الاحتفاظ بالأبعاد الأصلية دون تصغير الدقة.
  max_dimension: 0

  # الحفاظ على تدرجات الألوان وخوارزمية حفظ الجودة
  optimize_encoding: true


# إدارة البيانات الوصفية (Metadata & Apple Photos Compatibility)
metadata:
  # استنساخ كافة الوسوم الأصلية بنسبة 100% عبر ExifTool
  strict_copy: true

  # معالجة المنطقة الزمنية بدقة لمنع إزاحة تواريخ فيديوهات QuickTime
  quicktime_utc: true

  # مزامنة تواريخ نظام ملفات ويندوز (Creation & Modification Times) لتتطابق مع وقت التقاط الكاميرا
  sync_filesystem_timestamps: true

  # الحفاظ على معرفات الصور الحية (Live Photos Content Identifier)
  preserve_live_photos: true

  # نسخ ملفات التعديل المساندة (.AAE) للصور التي تم تعديلها داخل الآيفون
  copy_apple_sidecars: true


# إدارة العتاد والتوازي (Hardware & Concurrency)
hardware:
  # عدد العمليات المتزامنة لضغط الفيديو على كرت الشاشة (RTX 3060 Ti)
  # ينصح بـ 2 أو 3 لتجنب تجاوز ذاكرة الـ VRAM وجلسات NVENC المسموحة
  gpu_video_workers: 2

  # عدد خيوط معالجة الصور على المعالج (CPU Threads)
  # 0 تعني الكشف التلقائي المناسب لأنوية i7
  cpu_photo_workers: 6


# إجراءات السلامة والأمان (Safety & Integrity)
safety:
  # إذا كان الملف المضغوط أكبر أو مساوياً للملف الأصلي، احتفظ بالأصل لتفادي أي زيادة حجم غير مبررة
  keep_original_if_larger: true

  # التحقق من سلامة وصلاحية الملف بعد الضغط عبر ffprobe أو Image.verify قبل اعتماده
  verify_file_integrity: true

  # استخدام ملفات مؤقتة (.tmp) وعدم الكتابة فوق الملفات النهائية إلا بعد نجاح الضغط والميتاداتا
  atomic_writes: true

  # استخدام قاعدة بيانات محلية (SQLite) للاستئناف وتخطي ما تم إنجازه سابقاً
  enable_resume_db: true
