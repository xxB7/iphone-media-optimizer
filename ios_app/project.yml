name: Khafeef
options:
  bundleIdPrefix: com.xxb7
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Khafeef:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: "Khafeef"
        PRODUCT_BUNDLE_IDENTIFIER: "com.xxb7.khafeef"
        GENERATE_INFOPLIST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
