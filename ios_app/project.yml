name: Khafeef
options:
  bundleIdPrefix: com.xxb7
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Khafeef:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "خفيف"
        NSPhotoLibraryUsageDescription: "يحتاج التطبيق للوصول لمكتبة الصور لفحص ومقارنة وضغط الوسائط بأمان لتوفير مساحة الآيفون والآيكلاود."
        NSPhotoLibraryAddUsageDescription: "يحتاج التطبيق لحفظ النسخ المضغوطة ذات الجودة العالية في الاستديو."
        UILaunchStoryboardName: "LaunchScreen"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: "Khafeef"
        PRODUCT_BUNDLE_IDENTIFIER: "com.xxb7.khafeef"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_CFBundleDisplayName: "خفيف"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "يحتاج التطبيق للوصول لمكتبة الصور لفحص ومقارنة وضغط الوسائط بأمان لتوفير مساحة الآيفون والآيكلاود."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "يحتاج التطبيق لحفظ النسخ المضغوطة ذات الجودة العالية في الاستديو."
        INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    postBuildScripts:
      - name: Inject Required Info.plist Keys
        script: |
          TARGET_PLIST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Info.plist"
          if [ -f "$TARGET_PLIST" ]; then
            echo "Injecting privacy and launch screen keys into $TARGET_PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'يحتاج التطبيق للوصول لمكتبة الصور لفحص ومقارنة وضغط الوسائط بأمان لتوفير مساحة الآيفون والآيكلاود.'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'يحتاج التطبيق للوصول لمكتبة الصور لفحص ومقارنة وضغط الوسائط بأمان لتوفير مساحة الآيفون والآيكلاود.'" "$TARGET_PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'يحتاج التطبيق لحفظ النسخ المضغوطة ذات الجودة العالية في الاستديو.'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'يحتاج التطبيق لحفظ النسخ المضغوطة ذات الجودة العالية في الاستديو.'" "$TARGET_PLIST"
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string 'LaunchScreen'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName 'LaunchScreen'" "$TARGET_PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'خفيف'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'خفيف'" "$TARGET_PLIST"
          fi
    dependencies:
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
