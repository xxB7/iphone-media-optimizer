name: Build iOS IPA (Khafeef)

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    paths:
      - 'ios_app/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ipa:
    name: Build & Package iOS App
    runs-on: macos-14 # Fast Apple Silicon runner with Xcode pre-installed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "Using system default Xcode:"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project from project.yml
        run: |
          cd ios_app
          xcodegen generate
          # Defensive compatibility check: if Xcode is older than 16, patch format 77 to 56
          CURRENT_VER=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          if [ "$CURRENT_VER" -lt 16 ]; then
            echo "Xcode version is $CURRENT_VER (< 16), adjusting objectVersion for compatibility..."
            sed -i '' 's/objectVersion = [0-9][0-9]*/objectVersion = 56/' Khafeef.xcodeproj/project.pbxproj
          fi

      - name: Compile and Build App (xcodebuild)
        run: |
          cd ios_app
          xcodebuild -project Khafeef.xcodeproj \
                     -scheme Khafeef \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package App into .ipa
        run: |
          cd ios_app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Khafeef.app Payload/
          zip -r -y Khafeef.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khafeef-iOS-IPA
          path: ios_app/Khafeef.ipa
          retention-days: 14
