name: Build iOS IPA (Khafeef)

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    paths:
      - 'ios_app/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ipa:
    name: Build & Package iOS App
    runs-on: macos-14 # Fast Apple Silicon runner with Xcode pre-installed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project from project.yml
        run: |
          cd ios_app
          xcodegen generate

      - name: Compile and Build App (xcodebuild)
        run: |
          cd ios_app
          xcodebuild -project Khafeef.xcodeproj \
                     -scheme Khafeef \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package App into .ipa
        run: |
          cd ios_app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Khafeef.app Payload/
          zip -r -y Khafeef.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khafeef-iOS-IPA
          path: ios_app/Khafeef.ipa
          retention-days: 14
